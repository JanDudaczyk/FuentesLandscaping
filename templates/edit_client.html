{% extends "base.html" %}

{% block title %}Edit Client - Fuentes Landscaping{% endblock %}

{% block content %}
    <section aria-labelledby="edit-heading">
        <h2 id="edit-heading">Edit Client</h2>

        <form method="POST" action="{{ url_for('edit_client', client_id=client.id) }}" class="form-grid">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="{{ client.name }}" required>
            </div>
            <div>
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ client.phone or '' }}">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ client.email or '' }}">
            </div>
            <div>
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ client.address or '' }}">
            </div>
            <div>
                <label for="service">Service</label>
                <select id="service" name="service" required>
                    {% for option in ["Lawn Care", "Landscaping", "Snow Removal", "Other"] %}
                        <option value="{{ option }}" {% if client.service == option %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% for option in ["Active", "Inactive"] %}
                        <option value="{{ option }}" {% if client.status == option %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="{{ url_for('dashboard') }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
